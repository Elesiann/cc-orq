name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: bash tests/runners-shell.sh
      - run: bash tests/integrate-shell.sh
      - run: bash tests/question-shell.sh
      - run: bash tests/allowlist-shell.sh
