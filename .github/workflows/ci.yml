name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/build-vendor.mjs --check
      - run: npm test
      - run: bash tests/runners-shell.sh
      - run: bash tests/integrate-shell.sh
      - run: bash tests/question-shell.sh
      - run: bash tests/server-shell.sh
      - run: bash tests/worktree-include-shell.sh
      - run: bash tests/lock-shell.sh
      - run: bash tests/hook-shell.sh
      - run: bash tests/allowlist-shell.sh
      - if: runner.os == 'Linux'
        run: shellcheck tests/live/*.sh tests/live/scenarios/*.sh

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: modelcontextprotocol/conformance
          ref: c37eec888e1c6ff140af79987a40008548b7cc5f
          path: conformance-suite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: conformance-suite
      - run: node tests/conformance/run.mjs --out "$RUNNER_TEMP/conformance"
        env:
          CONFORMANCE_CMD: conformance-suite/node_modules/.bin/tsx conformance-suite/src/index.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance
